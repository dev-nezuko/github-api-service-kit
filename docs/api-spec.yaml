openapi: 3.0.0
info:
  title: Downshift pull-request statistics
  version: 1.0.0
  description: >-
    Opened and closed pull-request counts for the downshift-js/downshift repository, grouped by UTC
    calendar month. Months without events are omitted. Results are cached for CACHE_TTL_SECONDS.

paths:
  /api/v1/repo/stats:
    get:
      summary: Get a summary of pull requests for all months
      description: Retrieve a summary of opened and closed pull requests grouped by month for the Downshift repository.
      responses:
        200:
          description: A successful response with the summary of pull requests by month
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Summary'
        502:
          $ref: '#/components/responses/UpstreamFailure'
        503:
          $ref: '#/components/responses/RateLimited'
        504:
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/repo/stats/summary:
    get:
      summary: Get a summary of pull requests for a specific month and year
      description: Retrieve a summary of opened and closed pull requests for a given month and year in the Downshift repository.
      parameters:
        - name: month
          in: query
          description: The target month (1-12, leading zero allowed)
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: year
          in: query
          description: The target four-digit year
          required: true
          schema:
            type: integer
            minimum: 1000
            maximum: 9999
      responses:
        200:
          description: A successful response with the summary of pull requests for the specified month and year
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
        400:
          description: A parameter is missing, malformed or repeated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: No data found for the given month and year
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        502:
          $ref: '#/components/responses/UpstreamFailure'
        503:
          $ref: '#/components/responses/RateLimited'
        504:
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/repo/stats/year-summary:
    get:
      summary: Get a summary of pull requests for a specific year
      description: Retrieve a summary of opened and closed pull requests grouped by month for a given year in the Downshift repository.
      parameters:
        - name: year
          in: query
          description: The target four-digit year
          required: true
          schema:
            type: integer
            minimum: 1000
            maximum: 9999
      responses:
        200:
          description: A successful response with the summary of pull requests by month for the specified year
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Summary'
        400:
          description: The year is missing, malformed or repeated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: No data found for the given year
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        502:
          $ref: '#/components/responses/UpstreamFailure'
        503:
          $ref: '#/components/responses/RateLimited'
        504:
          $ref: '#/components/responses/UpstreamTimeout'

components:
  responses:
    UpstreamFailure:
      description: GitHub returned an error or an unexpected response, or could not be reached
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: GitHub's rate limit was reached
      headers:
        Retry-After:
          description: Seconds until GitHub expects to accept requests again, when known
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpstreamTimeout:
      description: A GitHub request exceeded GITHUB_TIMEOUT_MS
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Summary:
      type: object
      properties:
        month:
          type: string
          description: The UTC month and year in English, e.g. January 2021
        opened:
          type: integer
          description: The number of pull requests opened in the specified month
        closed:
          type: integer
          description: The number of pull requests closed in the specified month
    Error:
      type: object
      properties:
        error:
          type: string
          description: The error message
